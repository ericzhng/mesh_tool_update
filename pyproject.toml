[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planemeshforge"
dynamic = ["version"]
description = "Interactive web-based editor for 2D structural meshes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Eric Zhang" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Flask",
]
dependencies = [
    "flask",
    "flask-socketio",
    "werkzeug",
    "numpy",
    "rich",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "build"]

[project.scripts]
planemeshforge = "planemeshforge.cli:main"

[tool.hatch.version]
path = "src/planemeshforge/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/planemeshforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
