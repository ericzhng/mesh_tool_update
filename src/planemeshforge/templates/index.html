<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaneMeshForge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">

    <script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/delaunator.min.js') }}"></script>
</head>
<body>
    <div id="app">
        <header id="menubar">
            <span class="brand">PlaneMeshForge</span>
            <div id="menubar-menus" style="display:flex;"></div>
            <div class="menubar-spacer"></div>
            <div id="project-indicator"><span class="dot"></span><span class="name">Untitled</span></div>
        </header>

        <nav id="tool-rail"></nav>

        <main id="canvas-area">
            <canvas id="mesh-canvas"></canvas>
            <div id="tool-hint"></div>
            <div id="viewport-controls"></div>
            <div id="toast-stack"></div>
        </main>

        <aside id="dock"></aside>

        <footer id="status-bar"></footer>
    </div>

    <div id="context-menu"></div>

    <input type="file" id="mesh-file-input" accept=".inp,.deck" style="display:none">
    <input type="file" id="project-file-input" accept=".json" style="display:none">

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
